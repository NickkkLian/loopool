<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pool Referee · Table Camera</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1412;color:#e8efe9}
header{padding:14px 20px;border-bottom:1px solid #1f2a25;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:18px}h1 span{color:#3ecf8e}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#22302a;color:#9fb8ad;letter-spacing:.04em}
.pill.motion{background:#3a321a;color:#facc15}.pill.sending{background:#1c2a3a;color:#60a5fa}.pill.watching{background:#173326;color:#3ecf8e}.pill.paused{background:#3a1d1d;color:#ff7b72}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px;padding:16px 20px}
.card{background:#16201b;border:1px solid #23302a;border-radius:14px;padding:14px}
h2{margin:0 0 10px;font-size:14px;color:#9fb8ad;font-weight:600}
label{font-size:12px;color:#9fb8ad;display:block;margin:8px 0 4px}
input,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #2c3b34;background:#0f1412;color:#e8efe9;font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
button{padding:9px 12px;border:1px solid #2f4a3d;border-radius:9px;background:transparent;color:#cfe3d9;font-weight:600;font-size:13px;cursor:pointer}
button.primary{background:#3ecf8e;border-color:#3ecf8e;color:#06140d}
button:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden}
video{display:block;width:100%;height:auto}
#ov{position:absolute;inset:0;width:100%;height:100%}
.hint{font-size:12px;color:#6f857b;margin-top:6px}
.turn{font-size:28px;font-weight:800;margin:4px 0}
.players{display:flex;gap:8px;margin-top:6px}.pc{flex:1;background:#0f1412;border:1px solid #23302a;border-radius:10px;padding:8px 10px;font-size:13px}.pc.on{border-color:#3ecf8e}
.log{max-height:520px;overflow:auto}
.item{border-bottom:1px solid #1f2a25;padding:10px 2px;font-size:13px;display:grid;grid-template-columns:48px 1fr;gap:10px}
.sc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:3px solid #2c3b34;color:#9fb8ad;font-size:14px}
.muted{color:#6f857b}.err{color:#ff7b72}.ok{color:#3ecf8e}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🎥 Pool Referee · <span>Table Camera</span></h1>
  <span class="pill" id="pill">STOPPED</span>
  <span class="muted" style="font-size:12px" id="meter"></span>
</header>
<main>
  <section>
    <div class="stage" id="stage">
      <video id="v" playsinline muted></video>
      <canvas id="ov"></canvas>
    </div>
    <div class="btns">
      <button id="cropBtn">Set table area</button>
      <button id="cropClear">Use full frame</button>
      <button id="pauseBtn" disabled>Pause detection</button>
      <button id="manualBtn" disabled>Score last shot now</button>
      <label style="display:flex;align-items:center;gap:8px;margin:0 0 0 auto;font-size:12px">Sensitivity
        <input type="range" id="sens" min="0.4" max="3" step="0.1" value="1" style="width:120px"></label>
    </div>
    <div class="hint" id="hint">Mount the camera above the table, start it, then click “Set table area”. Keep the table still for 3 s while it calibrates.</div>
  </section>
  <section>
    <div class="card">
      <h2>Setup</h2>
      <label for="base">n8n webhook base URL</label>
      <input id="base" placeholder="https://YOUR-NAME.app.n8n.cloud/webhook">
      <div class="row">
        <div><label for="table">Table ID</label><input id="table" value="T1"></div>
        <div><label for="src">Source</label><select id="src"><option value="camera">Live camera</option><option value="file">Video file (demo replay)</option></select></div>
      </div>
      <div id="camRow"><label for="dev">Camera</label><select id="dev"><option value="">Default (back camera)</option></select></div>
      <div id="fileRow" style="display:none"><label for="file">Video file</label><input type="file" id="file" accept="video/*"></div>
      <div class="btns"><button class="primary" id="startBtn">Start</button><button id="stopBtn" disabled>Stop</button></div>
      <div class="hint err" id="setupErr"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>Table now</h2>
      <div id="now" class="muted">Not connected yet.</div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>Shots</h2>
      <div class="log" id="log"><div class="muted" style="font-size:13px">No shots yet.</div></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('pr.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('pr.' + k, JSON.stringify(v)); } catch (e) {} } };

// ---------------- settings ----------------
$('base').value = store.get('base', ''); $('table').value = store.get('table', 'T1');
$('base').onchange = () => store.set('base', $('base').value.trim().replace(/\/+$/, ''));
$('table').onchange = () => store.set('table', $('table').value.trim().toUpperCase());
$('src').onchange = () => { $('camRow').style.display = $('src').value === 'camera' ? '' : 'none'; $('fileRow').style.display = $('src').value === 'file' ? '' : 'none'; };
const base = () => $('base').value.trim().replace(/\/+$/, '').replace(/\/(pool-[a-z]+)$/, '');
const tableId = () => ($('table').value.trim() || 'T1').toUpperCase();

// ---------------- video + geometry ----------------
const v = $('v'), ov = $('ov'), octx = ov.getContext('2d');
let crop = store.get('crop', null);
function srcRect() { const vw = v.videoWidth, vh = v.videoHeight, r = crop || { x: 0, y: 0, w: 1, h: 1 }; return [r.x * vw, r.y * vh, r.w * vw, r.h * vh]; }
const SMALL_W = 240;
const sc = document.createElement('canvas'), sctx = sc.getContext('2d', { willReadFrequently: true });
function smallGray() {
  const [sx, sy, sw, sh] = srcRect(); const w = SMALL_W, h = Math.max(1, Math.round(SMALL_W * sh / sw));
  if (sc.width !== w || sc.height !== h) { sc.width = w; sc.height = h; }
  sctx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);
  const d = sctx.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10;
  return g;
}
function diffFrac(a, b, th) { if (!a || !b || a.length !== b.length) return 0; let c = 0; for (let i = 0; i < a.length; i++) if (Math.abs(a[i] - b[i]) > th) c++; return c / a.length; }
function captureFull() {
  const [sx, sy, sw, sh] = srcRect(), s = 1568 / Math.max(sw, sh), c = document.createElement('canvas');
  c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height); return c;
}
const toBlob = (c, q = 0.85) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('frame')), 'image/jpeg', q));
function diffCanvas(a, b) {
  const c = document.createElement('canvas'); c.width = a.width; c.height = a.height;
  const A = a.getContext('2d').getImageData(0, 0, a.width, a.height).data, B = b.getContext('2d').getImageData(0, 0, b.width, b.height).data;
  const g = c.getContext('2d'), out = g.createImageData(a.width, a.height);
  for (let i = 0; i < A.length; i += 4) { const d = Math.abs(A[i] - B[i]) + Math.abs(A[i + 1] - B[i + 1]) + Math.abs(A[i + 2] - B[i + 2]); const x = d > 90 ? 255 : 0; out.data[i] = out.data[i + 1] = out.data[i + 2] = x; out.data[i + 3] = 255; }
  g.putImageData(out, 0, 0); return c;
}

// ---------------- detection state machine ----------------
let running = false, paused = false, timer = null, state = 'stopped';
let prev = null, onCount = 0, quietSince = null, motionStart = 0, stillSince = null, lastMid = 0, mids = [];
let still = null;                       // { canvas, small, at } = last calm table image (the "before" frame)
let before = null, calib = null, ON = 0.004, OFF = 0.0008, lastM = 0, lastFrameT = -1;
const STILL_MS = 1500, MOVED_MIN = 0.0005, MAX_SHOT_MS = 30000;

function setState(s) { state = s; const p = $('pill'); p.textContent = { stopped: 'STOPPED', calibrating: 'CALIBRATING…', idle: 'WATCHING', motion: 'SHOT IN PROGRESS', paused: 'PAUSED' }[s] || s.toUpperCase(); p.className = 'pill ' + ({ idle: 'watching', motion: 'motion', paused: 'paused' }[s] || ''); }
function resetRef() { prev = null; still = null; onCount = 0; quietSince = null; if (running && !paused) startCalibration(); }
function startCalibration() { calib = { start: performance.now(), samples: [] }; setState('calibrating'); }

function tick() {
  if (!running || v.readyState < 2 || !v.videoWidth) return;
  if (v.srcObject == null && v.currentTime === lastFrameT && !v.paused) return;   // file replay: wait for a new frame
  lastFrameT = v.currentTime;
  const t = performance.now(), g = smallGray();
  const m = diffFrac(g, prev, 18); prev = g; lastM = m;
  if (calib) {
    calib.samples.push(m);
    if (t - calib.start > 2500) {
      const s = calib.samples.slice(2).sort((a, b) => a - b), p95 = s[Math.floor(s.length * 0.95)] || 0, sens = +$('sens').value;
      OFF = Math.max(0.0002, p95 * 2) / sens; ON = Math.max(0.0005, p95 * 6) / sens;   // low floor: a single rolling ball must trigger
      calib = null; still = { canvas: captureFull(), small: g, at: t }; setState('idle');
      $('hint').textContent = `Calibrated. Noise ${(p95 * 100).toFixed(3)}% · start ${(ON * 100).toFixed(2)}% · stop ${(OFF * 100).toFixed(2)}%. Ready for shots.`;
    }
    draw(m); return;
  }
  if (paused) { draw(m); return; }
  if (state === 'idle') {
    if (m > ON) {
      if (++onCount >= 2) { setState('motion'); motionStart = t; stillSince = null; mids = []; lastMid = 0; before = still; }
    } else {
      onCount = 0;
      if (m < OFF) { quietSince = quietSince || t; if (t - quietSince > 800 && (!still || t - still.at > 1500)) still = { canvas: captureFull(), small: g, at: t }; }
      else quietSince = null;
    }
  } else if (state === 'motion') {
    if (t - lastMid > 350) {
      lastMid = t; const rel = (t - motionStart) / 1000;
      toBlob(captureFull(), 0.8).then(b => { mids.push({ t: rel, blob: b }); if (mids.length > 40) mids.splice(1, 1); }).catch(() => {});
    }
    if (m < OFF) { stillSince = stillSince || t; if (t - stillSince > STILL_MS) finishShot(g, t); }
    else stillSince = null;
    if (t - motionStart > MAX_SHOT_MS) finishShot(g, t);
  }
  draw(m);
}
function finishShot(g, t) {
  const b = before, after = captureFull(), dur = (t - motionStart) / 1000, myMids = mids.slice();
  setState('idle'); onCount = 0; quietSince = t; still = { canvas: after, small: g, at: t };
  if (!b) { addLog({ status: 'ignored', text: 'Movement before the reference image was ready, ignored.' }); return; }
  const moved = diffFrac(b.small, g, 40);
  if (moved < MOVED_MIN) { addLog({ status: 'ignored', text: `Movement seen but no ball moved (${(moved * 100).toFixed(3)}%), ignored.` }); return; }
  enqueue({ before: b.canvas, after, mids: myMids, dur, moved });
}
function scoreNow() {
  if (!still) return alert('Wait for calibration first.');
  const after = captureFull();
  enqueue({ before: still.canvas, after, mids: [], dur: 0, moved: null, manual: true });
}

// ---------------- sending ----------------
const queue = []; let busy = false, seq = 0;
function enqueue(p) { p.id = ++seq; p.li = addLog({ status: 'queued', text: p.manual ? 'Manual shot queued…' : `Shot detected (${p.dur.toFixed(1)} s) · queued…` }); queue.push(p); pump(); }
function sample(arr, n) { if (arr.length <= n) return arr; const out = []; for (let i = 0; i < n; i++) out.push(arr[Math.round(i * (arr.length - 1) / (n - 1))]); return out; }
async function pump() {
  if (busy || !queue.length) return;
  busy = true; const p = queue.shift(); const t0 = Date.now();
  updateLog(p.li, { status: 'sending', text: 'AI referee is looking…' });
  try {
    if (!base()) throw new Error('Set the n8n webhook base URL first.');
    const fd = new FormData();
    fd.append('table', tableId());
    fd.append('frame_start', await toBlob(p.before), '0.00.jpg');
    sample(p.mids, 6).forEach((m, i) => fd.append('frame_mid_' + (i + 1), m.blob, m.t.toFixed(2) + '.jpg'));
    fd.append('frame_end', await toBlob(p.after), Math.max(0.01, p.dur).toFixed(2) + '.jpg');
    fd.append('frame_diff', await toBlob(diffCanvas(p.before, p.after)), 'diff.jpg');
    const res = await fetch(base() + '/pool-score', { method: 'POST', body: fd });
    const raw = await res.text(); let d;
    try { d = JSON.parse(raw); } catch (e) { throw new Error(`n8n returned ${res.status}: ${raw.slice(0, 200) || '(empty)'}`); }
    if (!d.ok) throw new Error((d.error || d.message || 'Scoring failed') + (d.raw ? ' · AI said: ' + String(d.raw).slice(0, 160) : ''));
    updateLog(p.li, { status: 'done', data: d, secs: Math.round((Date.now() - t0) / 1000) });
    if (d.table) renderNow(d.table);
  } catch (e) {
    updateLog(p.li, { status: 'error', text: /fetch|load failed|network/i.test(e.message) ? 'Could not reach n8n. Check the base URL and that the workflow is Active.' : e.message });
  } finally { busy = false; pump(); }
}

// ---------------- UI: log + table state ----------------
function color(s) { return s >= 85 ? '#3ecf8e' : s >= 70 ? '#a3e635' : s >= 50 ? '#facc15' : '#ff7b72'; }
function addLog(o) {
  const log = $('log'); if (log.firstElementChild && log.firstElementChild.classList.contains('muted')) log.innerHTML = '';
  const li = document.createElement('div'); li.className = 'item'; log.prepend(li); updateLog(li, o); return li;
}
function updateLog(li, o) {
  const time = new Date().toLocaleTimeString();
  if (o.status === 'done') {
    const d = o.data, g = d.game || {};
    li.innerHTML = `<div class="sc" style="border-color:${color(d.score)};color:${color(d.score)}">${d.score}</div>
      <div><b>${esc(d.player || '?')}</b> · ${esc(d.grade)} <span class="muted">· ${time} · ${o.secs}s</span>
      ${d.foul_reason ? `<div class="err">Foul: ${esc(d.foul_reason)}</div>` : ''}
      <div>${esc(g.reason || (d.skipped ? 'Not counted' : ''))}</div>
      ${g.turn_after ? `<div class="ok">➡️ Next: ${esc(g.turn_after)}${g.ball_in_hand ? ' (ball in hand)' : ''}</div>` : ''}
      ${g.finished ? `<div class="ok">🏆 ${esc(g.winner)} wins!</div>` : ''}
      ${d.needs_review ? '<div style="color:#facc15">⚠️ Low confidence: check this shot</div>' : ''}
      ${d.apply_error ? `<div class="err">Game not updated: ${esc(d.apply_error)}</div>` : ''}
      <div class="muted">${esc(d.observations || '')}</div></div>`;
  } else {
    const icon = { queued: '⏳', sending: '🧠', ignored: '·', error: '⚠️' }[o.status] || '';
    li.innerHTML = `<div class="sc">${icon}</div><div class="${o.status === 'error' ? 'err' : o.status === 'ignored' ? 'muted' : ''}">${esc(o.text)}<div class="muted">${time}</div></div>`;
  }
}
function renderNow(t) {
  const m = t.match;
  if (!m) { $('now').innerHTML = '<span class="muted">No match on this table. Shots count as practice.</span>'; return; }
  const ps = m.players.map(p => `<div class="pc ${p.is_shooting ? 'on' : ''}"><b>${esc(p.name)}</b> ${p.is_shooting ? '🎯' : ''}<div class="muted">${p.group ? esc(p.group) + ' · ' + p.balls_left + ' left' : 'open table'} · ${p.rating}</div></div>`).join('');
  $('now').innerHTML = m.status === 'playing'
    ? `<div class="muted" style="font-size:12px">${esc(m.game_type)} · shot ${m.shots_count}</div><div class="turn">🎯 ${esc(m.shooter)}${m.ball_in_hand ? ' <span style="font-size:14px;color:#facc15">ball in hand</span>' : ''}</div><div class="muted" style="font-size:13px">${esc(m.last_reason || '')}</div><div class="players">${ps}</div>`
    : `<div class="turn">🏆 ${esc(m.winner)} won</div><div class="muted" style="font-size:13px">${esc(m.end_reason || '')}${t.next_up ? ' · Next up: ' + esc(t.next_up) : ''}</div><div class="players">${ps}</div>`;
}
async function pollState() {
  if (!base()) return;
  try { const r = await fetch(`${base()}/pool-state?table=${encodeURIComponent(tableId())}`); const d = await r.json(); if (d.ok && d.table) renderNow(d.table); } catch (e) {}
}
setInterval(pollState, 3000);

// ---------------- overlay ----------------
let cropMode = false, pts = [];
function draw(m) {
  const r = ov.getBoundingClientRect(); if (ov.width !== Math.round(r.width) || ov.height !== Math.round(r.height)) { ov.width = Math.round(r.width); ov.height = Math.round(r.height); }
  const W = ov.width, H = ov.height; octx.clearRect(0, 0, W, H);
  if (crop) {
    octx.fillStyle = 'rgba(0,0,0,.45)'; const x = crop.x * W, y = crop.y * H, w = crop.w * W, h = crop.h * H;
    octx.fillRect(0, 0, W, y); octx.fillRect(0, y + h, W, H - y - h); octx.fillRect(0, y, x, h); octx.fillRect(x + w, y, W - x - w, h);
    octx.strokeStyle = state === 'motion' ? '#facc15' : '#3ecf8e'; octx.lineWidth = 2; octx.strokeRect(x, y, w, h);
  }
  pts.forEach(p => { octx.fillStyle = '#3ecf8e'; octx.beginPath(); octx.arc(p.x * W, p.y * H, 6, 0, 7); octx.fill(); });
  if (m !== undefined && running) {
    const bw = Math.min(260, W - 24), lvl = Math.min(1, m / (ON * 2.5));
    octx.fillStyle = 'rgba(0,0,0,.6)'; octx.fillRect(12, H - 30, bw, 14);
    octx.fillStyle = m > ON ? '#facc15' : '#3ecf8e'; octx.fillRect(12, H - 30, bw * lvl, 14);
    octx.fillStyle = '#fff'; octx.fillRect(12 + bw * (1 / 2.5), H - 33, 2, 20);
    $('meter').textContent = `motion ${(m * 100).toFixed(3)}%`;
  }
  if (cropMode) { octx.fillStyle = 'rgba(0,0,0,.6)'; octx.fillRect(0, 0, W, 34); octx.fillStyle = '#fff'; octx.font = '14px sans-serif'; octx.fillText(pts.length ? 'Now click the bottom-right corner of the table' : 'Click the top-left corner of the table (outside the pockets)', 12, 22); }
}
ov.onclick = e => {
  if (!cropMode) return;
  const r = ov.getBoundingClientRect(); pts.push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
  if (pts.length === 2) {
    const [a, b] = pts; const c = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) };
    crop = c.w > 0.1 && c.h > 0.1 ? c : null; store.set('crop', crop); cropMode = false; pts = []; resetRef();
  }
  draw();
};
$('cropBtn').onclick = () => { if (!v.videoWidth) { $('setupErr').textContent = 'Start the camera first.'; return; } cropMode = true; pts = []; draw(); };
$('cropClear').onclick = () => { crop = null; store.set('crop', null); resetRef(); draw(); };
$('sens').oninput = () => resetRef();
window.addEventListener('resize', () => draw());

// ---------------- start / stop ----------------
async function listDevices() {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'), sel = $('dev'), cur = sel.value;
    sel.innerHTML = '<option value="">Default (back camera)</option>' + devs.map((d, i) => `<option value="${esc(d.deviceId)}">${esc(d.label || 'Camera ' + (i + 1))}</option>`).join('');
    sel.value = cur;
  } catch (e) {}
}
function stopAll() {
  running = false; clearInterval(timer); setState('stopped');
  if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
  v.pause(); $('startBtn').disabled = false; $('stopBtn').disabled = true; $('pauseBtn').disabled = true; $('manualBtn').disabled = true;
}
async function start() {
  $('setupErr').textContent = '';
  if (!base()) { $('setupErr').textContent = 'Enter the n8n webhook base URL (ends with /webhook).'; return; }
  store.set('base', base()); store.set('table', tableId());
  stopAll();
  try {
    if ($('src').value === 'camera') {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Camera needs https:// or localhost. Host this page (see README) or use Chrome on this computer.');
      const id = $('dev').value;
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: id ? { deviceId: { exact: id }, width: { ideal: 1920 }, height: { ideal: 1080 } } : { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
      v.srcObject = stream; await v.play(); listDevices();
    } else {
      const f = $('file').files[0]; if (!f) throw new Error('Choose a video file.');
      v.src = URL.createObjectURL(f); v.loop = false; await v.play();
    }
  } catch (e) { $('setupErr').textContent = e.message; return; }
  running = true; paused = false; prev = null; still = null; lastFrameT = -1;
  startCalibration(); timer = setInterval(tick, 125);
  $('startBtn').disabled = true; $('stopBtn').disabled = false; $('pauseBtn').disabled = false; $('manualBtn').disabled = false; $('pauseBtn').textContent = 'Pause detection';
  pollState();
}
v.onended = () => { setTimeout(() => { if (running && state !== 'motion') { addLog({ status: 'ignored', text: 'Video finished.' }); stopAll(); } }, STILL_MS + 1200); };
$('startBtn').onclick = start;
$('stopBtn').onclick = stopAll;
$('pauseBtn').onclick = () => { paused = !paused; $('pauseBtn').textContent = paused ? 'Resume detection' : 'Pause detection'; if (paused) setState('paused'); else resetRef(); };
$('manualBtn').onclick = scoreNow;
draw();
</script>
</body>
</html>
